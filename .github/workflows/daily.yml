name: Daily AI report

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Write webhooks.json
        run: |
          cat > webhooks.json <<EOF
          {
            "realtime": "${{ secrets.DISCORD_WEBHOOK_REALTIME }}",
            "daily": "${{ secrets.DISCORD_WEBHOOK_DAILY }}",
            "weekly": "${{ secrets.DISCORD_WEBHOOK_WEEKLY }}"
          }
          EOF

      - name: Fetch latest before reporting
        run: python3 post_discord.py

      - name: Generate and send daily report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 ai_report.py daily

      - name: Commit and push updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json data/
          git commit -m "daily report $(date -u +%F)" || echo "nothing to commit"
          git push origin main || echo "nothing to push"
